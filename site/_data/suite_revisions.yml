# What the suite was, when. A published number only means something against a
# stated set of tasks, so every run records the revision it was measured on
# and results are only comparable within one.
# The current entry also drives the task totals shown on the homepage.

- id: "2026-09-10"
  name: "Gold Suite 1.2"
  version: "1.2"
  released: "2026-09-10"
  gold_tasks: 148
  app_run_tasks: 53
  public_sample_tasks: 8
  category_tasks:
    build: 1
    tests: 3
    runtime: 5
    visual: 9
    interaction: 27
    project: 4
    frameworks: 71
    ops: 28
  current: true
  summary: >-
    Gold Suite 1.2 adds five end-to-end composition tasks and strengthens
    answer isolation. Withheld tests are fetched from the sealed task repository
    only after the agent exits. Published results keep capability, list-price
    cost, and active agent time as separate measures.
  changes:
    - "Five composition tasks exercise complete product workflows across SwiftUI, persistence, networking, media, and UI automation."
    - "Every composition fixture was calibrated fail-then-pass before model results were accepted."
    - "Pass rate, recorded cost, and active agent time are reported separately; tokens and tool calls remain diagnostic data."
    - "Composition runs default to a 3,600-second wall-clock ceiling and a 1,000,000-token safety ceiling."
    - "Withheld tests do not exist in the agent-visible harness state; the runner fetches the exact task-set revision into a temporary grading checkout after the agent exits."
    - "The agent sandbox denies the complete .applebench state tree, including cached fixtures, solutions, task files, and other runs."


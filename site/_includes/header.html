<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include logo.html %}
      AppleBench
    </a>
    <nav class="site-nav" aria-label="Primary">
      {%- for item in site.nav -%}
        {%- assign target = item.url | relative_url -%}
        <a href="{{ target }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
      {%- if site.github_url %}<a href="{{ site.github_url }}" data-optional>GitHub</a>{% endif -%}
      <button class="icon-button" type="button" data-theme-toggle aria-label="Switch between light and dark theme">
        <svg class="icon-moon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a.6.6 0 0 0-.8-.7 6.9 6.9 0 1 0 8.6 8.6.6.6 0 0 0-.7-.8Z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm0-9.5a.65.65 0 0 1 .65.65v1.2a.65.65 0 0 1-1.3 0V2.15A.65.65 0 0 1 8 1.5Zm0 11a.65.65 0 0 1 .65.65v1.2a.65.65 0 0 1-1.3 0v-1.2A.65.65 0 0 1 8 12.5Zm6.5-4.5a.65.65 0 0 1-.65.65h-1.2a.65.65 0 0 1 0-1.3h1.2a.65.65 0 0 1 .65.65Zm-11 0a.65.65 0 0 1-.65.65h-1.2a.65.65 0 0 1 0-1.3h1.2A.65.65 0 0 1 3.5 8Zm9.1-4.6a.65.65 0 0 1 0 .92l-.85.85a.65.65 0 1 1-.92-.92l.85-.85a.65.65 0 0 1 .92 0ZM5.17 10.83a.65.65 0 0 1 0 .92l-.85.85a.65.65 0 0 1-.92-.92l.85-.85a.65.65 0 0 1 .92 0Zm7.43 1.77a.65.65 0 0 1-.92 0l-.85-.85a.65.65 0 1 1 .92-.92l.85.85a.65.65 0 0 1 0 .92ZM5.17 5.17a.65.65 0 0 1-.92 0l-.85-.85a.65.65 0 0 1 .92-.92l.85.85a.65.65 0 0 1 0 .92Z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

{%- comment -%}
Pass rate by task category. One measure, one series · magnitude by length,
so a single sequential hue and no legend. Params: rows (the run rows).
{%- endcomment -%}
<figure class="figure">
  <figcaption>
    <h3 class="figure__title">Pass rate by category</h3>
    <p class="figure__subtitle">
      Which kinds of Apple-platform work the model completed to a verified
      result. Ordered worst to best, so the weak capability is the first thing
      read rather than something averaged away.
    </p>
  </figcaption>

  {%- assign groups = include.rows | group_by: "category" -%}
  {%- assign ranked = "" | split: "" -%}
  {%- for group in groups -%}
    {%- assign hits = group.items | where: "passed", "true" -%}
    {%- assign rate = hits.size | times: 10000 | divided_by: group.items.size -%}
    {%- capture packed -%}{{ rate | prepend: "00000" | slice: -5, 5 }}|{{ group.name }}|{{ hits.size }}|{{ group.items.size }}{%- endcapture -%}
    {%- assign ranked = ranked | push: packed -%}
  {%- endfor -%}
  {%- assign ranked = ranked | sort -%}

  <div class="bars">
    {%- for packed in ranked -%}
      {%- assign parts = packed | split: "|" -%}
      {%- assign bar_label = parts[1] -%}
      {%- assign bar_value = parts[2] -%}
      {%- assign bar_total = parts[3] -%}
      {%- include bar-row.html label=bar_label value=bar_value total=bar_total color="series-1" -%}
    {%- endfor -%}
  </div>

  <p class="figure__note">
    A category's rate is only as meaningful as its task count, so both are
    printed. <code>ops</code> and <code>interaction</code> carry the most
    tasks and the most failures; <code>build</code> and <code>visual</code>
    carry the fewest of each.
  </p>

  <details class="data-table">
    <summary>View as a table</summary>
    <table>
      <thead>
        <tr><th scope="col">Category</th><th scope="col">Passed</th><th scope="col">Tasks</th><th scope="col">Rate</th></tr>
      </thead>
      <tbody>
        {%- for packed in ranked -%}
          {%- assign parts = packed | split: "|" -%}
          {%- assign row_label = parts[1] -%}
          {%- assign row_hits = parts[2] -%}
          {%- assign row_total = parts[3] -%}
          <tr>
            <td>{{ row_label }}</td>
            <td>{{ row_hits }}</td>
            <td>{{ row_total }}</td>
            <td>{{ row_hits | times: 1000 | divided_by: row_total | times: 0.1 | round: 1 }}%</td>
          </tr>
        {%- endfor -%}
      </tbody>
    </table>
  </details>
</figure>

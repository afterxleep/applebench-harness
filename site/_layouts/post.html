---
layout: default
---
<div class="wrap wrap--narrow">
  <div class="article-header">
    <p class="entry__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {%- for tag in page.tags %}<span>{{ tag }}</span>{% endfor -%}
    </p>
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="article-header__lede">{{ page.lede }}</p>{% endif -%}
  </div>
  <article class="prose">
    {{ content }}
  </article>
  <hr>
  <p><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</div>

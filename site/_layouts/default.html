<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171714" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2efe7" media="(prefers-color-scheme: light)">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  {%- feed_meta -%}
  <script>
    // Applied before first paint so a returning reader keeps their selection.
    (function () {
      try {
        var saved = localStorage.getItem("applebench-theme");
        document.documentElement.dataset.theme = saved || "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {%- include header.html -%}
  <main id="main">
    {{ content }}
  </main>
  {%- include footer.html -%}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>

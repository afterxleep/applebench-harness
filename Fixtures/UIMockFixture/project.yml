name: UIMockFixture
options:
  bundleIdPrefix: com.applebench
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
targets:
  UIMockFixture:
    type: application
    platform: iOS
    sources: [Sources]
  UIMockFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: UIMockFixture
schemes:
  UIMockFixture:
    build:
      targets:
        UIMockFixture: all
        UIMockFixtureUITests: [test]
    test:
      targets:
        - UIMockFixtureUITests

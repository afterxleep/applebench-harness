name: StateFixture
options:
  bundleIdPrefix: com.applebench
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
targets:
  StateFixture:
    type: application
    platform: iOS
    sources: [Sources]
  StateFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StateFixture
schemes:
  StateFixture:
    build:
      targets:
        StateFixture: all
        StateFixtureUITests: [test]
    test:
      targets:
        - StateFixtureUITests
